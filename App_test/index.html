<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="To-do">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <title>Ma To-do</title>
</head>
<body>
    <header>
        <h1>Ma To-do</h1>
    </header>

    <main>
        <form id="task-form" autocomplete="off">
            <input
                type="text"
                id="task-input"
                placeholder="Nouvelle tâche..."
                required
                maxlength="200"
                enterkeyhint="done">
            <button type="submit" aria-label="Ajouter la tâche">+</button>
        </form>

        <ul id="task-list" aria-live="polite"></ul>

        <p id="empty-state" hidden>Rien à faire. Profite ! 🌴</p>
    </main>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
